<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0a0a;
        --card: #151515;
        --border: rgba(255,255,255,.08);
        --border-soft: rgba(255,255,255,.06);
        --text-hi: #f2f2f2;
        --text-mid: #a8a8a8;
        --text-lo: #6f6f6f;
        --radius-pill: 999px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; overflow-x: hidden; position: relative; background: var(--bg); color: var(--text-hi); font-family: 'Manrope', sans-serif; }
    .glow-top { position: fixed; top: -280px; left: 50%; width: 820px; height: 560px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.1), transparent 70%); filter: blur(30px); pointer-events: none; }
    .glow-arc { position: absolute; top: 330px; left: 50%; width: 1000px; height: 260px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.06), transparent 70%); filter: blur(20px); pointer-events: none; }
    .container { width: min(100%, 760px); margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
    .logo { font-size: 18px; letter-spacing: .02em; }
    .logo b { font-weight: 800; }
    .nav-pill { display: flex; gap: 4px; padding: 5px; border: 1px solid var(--border-soft); border-radius: var(--radius-pill); background: rgba(255,255,255,.03); }
    .nav-pill span { padding: 8px 14px; border-radius: var(--radius-pill); color: var(--text-mid); font-size: 11px; }
    .nav-pill span.active { background: rgba(255,255,255,.08); color: #fff; }
    .nav-action { padding: 9px 17px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: linear-gradient(180deg,#3c3c3c,#161616); color: #fff; font-size: 11px; }
    .hero { min-height: calc(100vh - 86px); display: grid; place-items: center; padding: 54px 0 86px; text-align: center; }
    .hero-inner { width: min(100%, 560px); }
    .badge { display: inline-flex; align-items: center; padding: 7px 17px; margin-bottom: 20px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: rgba(255,255,255,.04); color: #c9c9c9; font-size: 11px; }
    h1 { margin-bottom: 18px; font-size: clamp(30px, 7vw, 50px); font-weight: 800; line-height: 1.12; letter-spacing: 0; background: linear-gradient(180deg,#fff,#8f8f8f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { max-width: 480px; margin: 0 auto 34px; color: var(--text-mid); font-size: 14px; line-height: 1.75; }
    .access-card { width: min(100%, 430px); margin: 0 auto; padding: 26px; border: 1px solid var(--border); border-radius: 20px; background: linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)); text-align: left; box-shadow: 0 24px 70px rgba(0,0,0,.4); }
    .access-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; color: var(--text-lo); font-size: 11px; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.05); color: #ddd; font-size: 18px; }
    .timer { color: #fff; font-size: 28px; font-weight: 800; }
    .rule { height: 1px; margin-bottom: 18px; background: var(--border); }
    .btn { width: 100%; min-height: 50px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: linear-gradient(180deg,#3c3c3c,#161616); color: #666; font: 700 12px 'Manrope', sans-serif; cursor: not-allowed; transition: transform .15s, background .2s, color .2s, border-color .2s; }
    .btn.ready { background: linear-gradient(180deg,#f2f2f2,#aaa); border-color: #fff; color: #111; cursor: pointer; }
    .btn.ready:hover { transform: translateY(-2px); background: #fff; }
    .note { margin-top: 14px; color: var(--text-lo); font-size: 11px; line-height: 1.6; text-align: center; }
    footer { border-top: 1px solid var(--border-soft); padding: 25px 0 28px; color: var(--text-lo); font-size: 11px; text-align: center; }
    @media (max-width: 560px) { .nav-pill { display: none; } .nav-action { padding: 8px 13px; } .hero { padding-top: 28px; } .access-card { padding: 22px; } }
</style>
</head>
<body>
<div class="glow-top"></div>
<div class="glow-arc"></div>
<div class="container">
    <nav>
        <div class="logo">Quirky<b></b></div>
        <!-- <div class="nav-pill"><span class="active"></span><span></span><span></span></div> -->
        <div class="nav-action">{{ eyebrow }}</div>
    </nav>
    <main class="hero">
        <div class="hero-inner">
            <span class="badge">{{ eyebrow }}</span>
            <h1>{{ heading }}</h1>
            <p class="lead">{{ description }}</p>
            <section class="access-card">
                <div class="mark">{{ mark }}</div>
                <div class="access-head"><span>{{ status }}</span><strong class="timer" id="timer">5</strong></div>
                <div class="rule"></div>
                <button class="btn" id="action" type="button" disabled data-target="{{ target|e }}" data-ready-label="{{ ready_label|e }}" data-ready-note="{{ ready_note|e }}">{{ waiting_label }}</button>
                <p class="note" id="note">{{ waiting_note }}</p>
            </section>
        </div>
    </main>
</div>
<footer>© {{ current_year|default('2026') }} Quirky. All rights reserved.</footer>
<script>
    (() => {
        let seconds = 5;
        const timer = document.getElementById('timer');
        const action = document.getElementById('action');
        const note = document.getElementById('note');
        const target = action.dataset.target;
        const readyLabel = action.dataset.readyLabel;
        const readyNote = action.dataset.readyNote;
        const interval = window.setInterval(() => {
            seconds -= 1;
            timer.textContent = Math.max(0, seconds);
            if (seconds <= 0) {
                window.clearInterval(interval);
                action.disabled = false;
                action.classList.add('ready');
                action.textContent = readyLabel;
                note.textContent = readyNote;
                action.addEventListener('click', () => window.location.replace(target), { once: true });
            }
        }, 1000);
    })();
</script>
</body>
</html>
